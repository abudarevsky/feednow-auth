# feednow-auth local Docker composition.
#
# Run from this directory. The `cognito` profile selects the Cognito-aware
# local composition root; the `testing` profile selects DynamoDB Local for
# adapter-conformance tests. The app's DynamoDB Local mode is defined in
# docker-compose.dynamodb-local.yml.
#
#   docker compose --profile cognito up --build          # local account app
#
# Non-secret configuration names are documented in .env.example; the actual
# values live in the non-committed .env loaded via `env_file` below.

# Fixed project name keeps local named volumes stable across invocations.
name: feednow-auth

services:
  # Docker creates named-volume roots as root.  The application deliberately
  # runs as uid 1000, so initialise (and repair existing local volumes) before
  # it opens SQLite.  This service is local-only and never handles secrets.
  data-init:
    profiles: ["cognito", "ui"]
    image: busybox:1.36.1
    user: "0:0"
    volumes:
      - feednow-data:/data
    command: ["sh", "-c", "chown -R 1000:1000 /data"]

  app:
    profiles: ["cognito", "ui"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: prod
    # Local Cognito-aware composition root with selectable storage.
    command: uvicorn local_runtime:app --app-dir deploy/docker --host 0.0.0.0 --port 8000 --no-access-log
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - feednow-data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      FEEDNOW_STORAGE_BACKEND: ${FEEDNOW_STORAGE_BACKEND:-sqlite}
      FEEDNOW_SQLITE_PATH: ${FEEDNOW_SQLITE_PATH:-/data/feednow-auth.db}
      FEEDNOW_DYNAMODB_REGION: ${FEEDNOW_DYNAMODB_REGION:-us-east-1}
      FEEDNOW_TABLE_PREFIX: ${FEEDNOW_TABLE_PREFIX:-feednow-auth-local-}
      FEEDNOW_DYNAMODB_ENDPOINT: ${FEEDNOW_DYNAMODB_ENDPOINT:-}

  ui:
    profiles: ["ui"]
    build:
      context: ../../../feednow-auth-ui
      dockerfile: Dockerfile
    environment:
      FEEDNOW_AUTH_ORIGIN: http://app:8000
    ports:
      - "3000:3000"
    depends_on:
      - app

  dynamodb-local:
    profiles: ["testing"]
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"

volumes:
  feednow-data:
