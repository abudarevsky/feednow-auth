# feednow-auth local Docker composition (Phase 10).
#
# Run from this directory. The `cognito` profile selects the Cognito-aware
# local composition root; the `testing` profile selects DynamoDB Local for
# the Phase 06 adapter-conformance recipe. The two profiles share host port
# 8000 but are used in separate commands, so they never collide.
#
#   docker compose --profile cognito up --build          # local account app
#
# Non-secret configuration names are documented in .env.example; the actual
# values live in the non-committed .env loaded via `env_file` below.

# Fixed project name so the SQLite volume is always
# `feednow-auth_feednow-data` (docs/RUNNING_WITH_COGNITO.md §6), whether
# compose is invoked directly or through another file layering.
name: feednow-auth

services:
  # Docker creates named-volume roots as root.  The application deliberately
  # runs as uid 1000, so initialise (and repair existing local volumes) before
  # it opens SQLite.  This service is local-only and never handles secrets.
  data-init:
    profiles: ["cognito", "ui"]
    image: busybox:1.36.1
    user: "0:0"
    volumes:
      - feednow-data:/data
    command: ["sh", "-c", "chown -R 1000:1000 /data"]

  app:
    profiles: ["cognito", "ui"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: prod
    # Local Cognito-aware composition root: SQLite storage, JWKS
    # verification, API-key pepper, and the /oauth/callback capture page.
    command: uvicorn local_runtime:app --app-dir deploy/docker --host 0.0.0.0 --port 8000 --no-access-log
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - feednow-data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
    # Lets the documented DynamoDB Local recipe inject the endpoint via
    # interpolation at `run` time without baking it into .env.
    environment:
      FEEDNOW_DYNAMODB_LOCAL_ENDPOINT: ${FEEDNOW_DYNAMODB_LOCAL_ENDPOINT:-}

  ui:
    profiles: ["ui"]
    build:
      context: ../../../feednow-auth-ui
      dockerfile: Dockerfile
    environment:
      FEEDNOW_AUTH_ORIGIN: http://app:8000
    ports:
      - "3000:3000"
    depends_on:
      - app

  dynamodb-local:
    profiles: ["testing"]
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"

volumes:
  feednow-data:
